server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/wasm font/ttf font/otf image/svg+xml;

    # Security headers. nginx drops server-level add_header lines in any
    # location that has its own add_header, so those locations repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API on the same origin as the site, so one public domain serves both
    # (and the browser needs no CORS). "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass the tunnel's X-Forwarded-For through as-is: with trust proxy = 1
        # the backend takes its last entry, the real client IP added by ngrok.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10m;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Flutter web file names (main.dart.js, assets, fonts) stay the same
    # between releases, so they must not be cached as "immutable": browsers
    # would keep running an old app for a year. "no-cache" re-checks on every
    # visit; unchanged files answer 304 (ETag), so it costs almost nothing.
    location ~* \.(?:js|css|wasm|json|png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
