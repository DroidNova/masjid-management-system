x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: masjid-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Bound to 127.0.0.1: reachable from this PC only, never from the network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ./masjid-core
      dockerfile: Dockerfile
    container_name: masjid-backend
    restart: unless-stopped
    env_file:
      - ./masjid-core/.env
    environment:
      # This compose file is the local development stack. NODE_ENV=production
      # refuses to start until real SMS OTP exists (milestone M6); the VPS
      # stack gets its own compose file then.
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Public traffic arrives through the frontend's nginx; read the client IP
      # from X-Forwarded-For so rate limits are per visitor, not per proxy.
      TRUST_PROXY: "true"
    # Local only; the public way in is the tunnel, through the frontend's nginx.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # Flutter Web in nginx. nginx also proxies /api/ to the backend, so the site
  # and the API share one origin (and one public domain).
  frontend:
    build:
      context: ./masjid-core-frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:3000/api/v1}
    container_name: masjid-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # Public HTTPS address (static ngrok domain): the website at /, the API at
  # /api/ for the APK. NGROK_AUTHTOKEN lives in .env.tunnel (not in git).
  tunnel:
    # Optional: runs only with the "tunnel" profile (COMPOSE_PROFILES=tunnel in .env).
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    container_name: masjid-tunnel
    restart: unless-stopped
    env_file:
      - path: ./.env.tunnel
        required: false
    command: ["http", "--url=${NGROK_DOMAIN:-set-NGROK_DOMAIN-in-.env}", "frontend:80"]
    depends_on:
      frontend:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
